<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Online Exam System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>🎓 Online Exam System</h1>

        <!-- Student Name -->

        <div id="startScreen">

            <h2>Enter Student Name</h2>

            <input
                type="text"
                id="studentName"
                placeholder="Enter your name"
            >

            <button onclick="startExam()">
                Start Exam
            </button>

        </div>


        <!-- Exam Screen -->

        <div id="examScreen">

            <div class="exam-header">

                <span>
                    Question:
                    <span id="questionNumber">1</span>/10
                </span>

                <span>
                    Time:
                    <span id="time">60</span> sec
                </span>

            </div>


            <h2 id="question"></h2>


            <div id="options"></div>


            <button onclick="nextQuestion()" id="nextButton">
                Next
            </button>

        </div>


        <!-- Result Screen -->

        <div id="resultScreen">

            <h2>🎉 Exam Completed!</h2>

            <p>
                Student:
                <strong id="resultName"></strong>
            </p>

            <p>
                Score:
                <strong id="score"></strong>
            </p>

            <p>
                Percentage:
                <strong id="percentage"></strong>
            </p>

            <h2 id="resultMessage"></h2>

            <button onclick="restartExam()">
                🔄 Restart Exam
            </button>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
